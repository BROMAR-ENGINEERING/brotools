<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>BroTools</title>
<script>
  /* Apply theme before first paint to avoid a flash */
  (function () {
    var t = null;
    try { t = localStorage.getItem('brotools-theme'); } catch (e) {}
    if (!t && window.matchMedia('(prefers-color-scheme: dark)').matches) t = 'dark';
    if (t === 'dark') document.documentElement.setAttribute('data-theme', 'dark');
  })();
</script>
<link rel="stylesheet" href="css/shared.css">
<link rel="stylesheet" href="css/brotools.css">
</head>
<body>
<div class="bt-shell">

  <header class="header bt-header">
    <div class="header-left">
      <a class="control-btn" href="#/" aria-label="Home" title="Home">
        <svg viewBox="0 0 24 24"><path d="M3 11l9-7 9 7"/><path d="M5 10v10h5v-6h4v6h5V10"/></svg>
      </a>
      <a class="bt-logo" href="#/" aria-label="BroTools home">
        <img class="light-logo" src="assets/logo/bromar-logo-light.png" alt="Bromar">
        <img class="dark-logo" src="assets/logo/bromar-logo-dark.png" alt="Bromar">
      </a>
    </div>

    <h1 class="page-title bt-title" id="pageTitle">BroTools</h1>

    <div class="header-right">
      <button class="control-btn" id="themeToggle" aria-label="Toggle light/dark mode" title="Light / dark mode">
        <svg class="moon-icon" viewBox="0 0 24 24"><path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5z"/></svg>
        <svg class="sun-icon" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
      </button>
    </div>
  </header>

  <main id="view"></main>

</div>
<div class="revision-number">BroTools V1.00</div>

<script type="module" src="js/app.js"></script>
</body>
</html>
